[project]
name = "marsx"
version = "0.1.0"
description = "MARS-X geospatial data pipeline (Jezero) and intelligence modules"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.5",
  "numba>=0.68",
  "rasterio>=1.5",
  "pyproj>=3.8",
  "pydantic>=2.12",
  "pillow>=12",
  "scipy>=1.17",
  "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marsx"]

[tool.uv]
exclude-newer = "2026-11-07"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
